    <script>
      // Gracefully handle Vite HMR WebSocket in Cloud Run iframe environments
      (function () {
        // 1. Intercept console.error for benign Vite HMR connection notices
        var origConsoleError = console.error;
        console.error = function () {
          var args = Array.prototype.slice.call(arguments);
          var text = '';
          for (var i = 0; i < args.length; i++) {
            var item = args[i];
            if (typeof item === 'string') {
              text += item + ' ';
            } else if (item && item.message) {
              text += item.message + ' ' + (item.stack || '') + ' ';
            } else {
              try { text += JSON.stringify(item) + ' '; } catch (e) { text += String(item) + ' '; }
            }
          }
          if (
            text.indexOf('WebSocket closed without opened') !== -1 ||
            (text.indexOf('[vite]') !== -1 && (text.indexOf('WebSocket') !== -1 || text.indexOf('connecting') !== -1 || text.indexOf('failed to connect') !== -1))
          ) {
            return; // Benign Vite dev HMR notice in reverse proxy
          }
          return origConsoleError.apply(console, arguments);
        };

        // 2. Intercept window error and unhandledrejection
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event && event.reason;
          var msg = (reason && reason.message) || String(reason || '');
          var stack = (reason && reason.stack) || '';
          if (msg.indexOf('WebSocket') !== -1 || stack.indexOf('@vite/client') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('error', function (event) {
          var msg = (event && event.message) || '';
          var filename = (event && event.filename) || '';
          var stack = (event && event.error && event.error.stack) || '';
          if (msg.indexOf('WebSocket') !== -1 || filename.indexOf('@vite/client') !== -1 || stack.indexOf('@vite/client') !== -1) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        // 3. Stub Vite HMR WebSocket so it never crashes or tries unreachable WSS in iframe
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          function ViteSafeWebSocket(url, protocols) {
            var isVite = false;
            if (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) {
              isVite = true;
            } else if (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) {
              isVite = true;
            } else if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('/@vite/') !== -1)) {
              isVite = true;
            }

            if (isVite) {
              var listeners = {};
              var mock = {
                binaryType: 'blob',
                bufferedAmount: 0,
                extensions: '',
                protocol: 'vite-hmr',
                readyState: 1, // OPEN
                url: String(url),
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                onopen: null,
                onclose: null,
                onerror: null,
                onmessage: null,
                addEventListener: function (type, fn) {
                  listeners[type] = listeners[type] || [];
                  listeners[type].push(fn);
                },
                removeEventListener: function (type, fn) {
                  if (!listeners[type]) return;
                  var idx = listeners[type].indexOf(fn);
                  if (idx !== -1) listeners[type].splice(idx, 1);
                },
                dispatchEvent: function (ev) {
                  var fns = listeners[ev && ev.type] || [];
                  fns.forEach(function (f) {
                    try { f.call(mock, ev); } catch (e) {}
                  });
                  return true;
                },
                send: function () {},
                close: function () {
                  mock.readyState = 3;
                  var ev = { wasClean: true, code: 1000, reason: 'Normal Closure' };
                  if (typeof mock.onclose === 'function') mock.onclose(ev);
                }
              };

              setTimeout(function () {
                if (mock.readyState === 1) {
                  var ev = { type: 'open' };
                  if (typeof mock.onopen === 'function') mock.onopen(ev);
                  var openFns = listeners['open'] || [];
                  openFns.forEach(function (f) {
                    try { f.call(mock, ev); } catch (e) {}
                  });
                }
              }, 0);

              return mock;
            }

            return new OrigWebSocket(url, protocols);
          }

          ViteSafeWebSocket.CONNECTING = 0;
          ViteSafeWebSocket.OPEN = 1;
          ViteSafeWebSocket.CLOSING = 2;
          ViteSafeWebSocket.CLOSED = 3;
          ViteSafeWebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket = ViteSafeWebSocket;
        }
      })();
    </script>
